---
# Fast gate for every push/PR: renders all profiles and verifies every
# package name exists upstream. No packages are installed (~1 minute).
name: "CI"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yaml"
      - ".chezmoiroot"
      - "chezmoi/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yaml"
      - ".chezmoiroot"
      - "chezmoi/**"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Render and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Validate init data
        run: ./tests/chezmoi-init-data.sh

      - name: Validate configuration render matrix
        run: ./tests/chezmoi-render-config.sh

      - name: Validate package names
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/chezmoi-package-names.sh
