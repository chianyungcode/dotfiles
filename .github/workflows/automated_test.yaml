---
name: "Automated Tests"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".chezmoiroot"
      - "chezmoi/**"
    branches:
      - master
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".chezmoiroot"
      - "chezmoi/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-dotfiles:
    env:
      CI: "true"
    # runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      # - name: Install APT dependencies
      #   if: startsWith(matrix.os, 'ubuntu')
      #   run: |
      #       apt-get update
      #       apt-get install -y git zsh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy repository to /home/runner/
        run: |
          if [ -d /home/runner ]; then homedir="/home/runner"; else homedir="/Users/runner"; fi

          mkdir -p ${homedir}/.local/share/chezmoi
          cp -a . ${homedir}/.local/share/chezmoi

      # ----------------------------------------------
      # Create config file
      # ----------------------------------------------
      - name: Create config file
        run: |
          if [ -d /home/runner ]; then homedir="/home/runner"; else homedir="/Users/runner"; fi

          mkdir -p ${homedir}/.config/chezmoi

          cat > ${homedir}/.config/chezmoi/chezmoi.toml<< EOF
          [data.identity]
              profile          = "server-minimal"
              git_name         = "chianyungcode-server"
              git_email        = "chianyungcode-server@local.invalid"
              github_username  = ""
              signing_key      = ""
              github_token     = ""

          [data.machine]
              role = "server"

          [data.features]
              development = true
              homelab     = false
              personal    = false
              graphical   = false

          [data.secrets]
              provider = "none"

          [data.encrypted_files]
              enabled = false

          [data.xdg]
              cache_home  = "${homedir}/.cache"
              config_home = "${homedir}/.config"
              data_home   = "${homedir}/.local/share"
              state_home  = "${homedir}/.local/state"
          EOF

      # ----------------------------------------------
      # Install chezmoi
      # ----------------------------------------------
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)"

      # ----------------------------------------------
      # Run chezmoi apply
      # ----------------------------------------------
      - name: Run chezmoi apply
        run: |
          if [ -d /home/runner ]; then homedir="/home/runner"; else homedir="/Users/runner"; fi
          source_dir="${homedir}/.local/share/chezmoi/chezmoi"

          ./bin/chezmoi --source "${source_dir}" --config "${homedir}/.config/chezmoi/chezmoi.toml" apply

      # ----------------------------------------------
      # UBUNTU: Confirm dotfiles are installed
      # ----------------------------------------------
      - name: Confirm dotfiles are installed
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          if [ -d /home/runner ]; then homedir="/home/runner"; else homedir="/Users/runner"; fi
          echo "------- Testing files -------"
          cd /home/runner
          # echo "pwd: $(pwd)"
          # ls -al

          existing_files=(
            .config/zsh/.zshrc
            .bashrc
            .config/git/config
            .ssh/config
            .config/zsh/conf.d/080-linux.sh
          )

          missing_files=(
            .config/zsh/conf.d/080-macos.sh
            Library
          )

          installed_packages=(
            jq
            pygmentize
          )

          # Confirm files exist
          for file in ${existing_files[@]}; do
            if [ ! -e "${homedir}/$file" ]; then
                echo "$file not found"
                exit 1
            fi
          done

          # Confirm files don't exist
          for file in ${missing_files[@]} ; do
            if [ -e "${homedir}/$file" ]; then
                echo "$file found"
                exit 1
            fi
          done

          # Confirm packages are installed
          for package in ${installed_packages[@]}; do
              if [ ! $(command -v $package) ]; then
                  echo "$package not found"
                  exit 1
              fi
          done

      # ----------------------------------------------
      # MACOS: Confirm dotfiles are installed
      # ----------------------------------------------
      - name: Confirm dotfiles are installed
        if: startsWith(matrix.os, 'macos')
        run: |
          if [ -d /home/runner ]; then homedir="/home/runner"; else homedir="/Users/runner"; fi

          echo "------- Testing files -------"
          cd ${homedir}

          existing_files=(
            .config/zsh/.zshrc
            .bashrc
            .config/git/config
            .config/nano/nanorc
            .ssh/config
            .config/zsh/conf.d/080-macos.sh
          )

          missing_files=(
            .config/zsh/conf.d/080-linux.sh
          )

          installed_packages=(
            jq
            pygmentize
          )

          # Confirm files exist
          for file in ${existing_files[@]}; do
            if [ ! -e "${homedir}/$file" ]; then
                echo "$file not found"
                exit 1
            fi
          done

          # Confirm files don't exist
          for file in ${missing_files[@]} ; do
            if [ -e "${homedir}/$file" ]; then
                echo "$file found"
                exit 1
            fi
          done

          # Confirm packages are installed
          for package in ${installed_packages[@]}; do
              if [ ! $(command -v $package) ]; then
                  echo "$package not found"
                  exit 1
              fi
          done
