[packages]
  [packages.python]
    to_remove = []

    [packages.python.common]
      packages = [
        # CLI / Text Rendering
        "halper",
        "pygments",
      ]

    [packages.python.development]
      packages = [
        # Automation & Infra
        "ansible-core",
        "cookiecutter",

        # Git Workflow
        "commitizen",
        "pre-commit",

        # Editor Integration
        "pynvim",
      ]

    [packages.python.homelab]
      packages = []

    [packages.python.personal]
      packages = [
        # Utility
        "smassh",

        # Media
        "vid-cleaner",
      ]

  [packages.cargo]
    to_remove = []

    [packages.cargo.common]
      packages = []

    [packages.cargo.development]
      packages = [
        # Cargo Tooling
        "cargo-binstall",
        "cargo-update",

        # Git & Version Control
        "koji",        # conventional commit cli alternative fo commitizen
        "starship-jj", # https://gitlab.com/lanastara_foss/starship-jj
        "worktrunk",   # git worktree wrapper

        # LSP, formatter & linters

        # Lua
        "stylua", # Lua formatter

        # Markdown
        "rumdl", # perfomance markdown linter

        # General
        "typos-cli",
      ]

    [packages.cargo.homelab]
      packages = []

    [packages.cargo.personal]
      packages = [
        # Utility
        "cargo-seek",

        # Git & Version Control
        "gitlogue",
      ]

  [packages.node]
    to_remove = []

    [packages.node.common]
      packages = []

    [packages.node.development]
      packages = [
        # Task Runner
        "@go-task/cli", # modern makefile alternative - https://taskfile.dev/

        # Editor Integration
        "neovim",
      ]

    [packages.node.homelab]
      packages = []

    [packages.node.personal]
      packages = [
        # AI / Developer Tools
        "@openai/codex",

        # Git Workflow
        "opencommit",
      ]

[[runtimes]]
  name     = "node"
  version  = "latest"
  features = ["development", "personal"]

[[runtimes]]
  name     = "go"
  version  = "latest"
  features = ["development"]

[[runtimes]]
  name     = "rust"
  version  = "latest"
  features = ["development", "personal"]

[[runtimes]]
  name     = "bun"
  version  = "latest"
  features = ["development"]

[[runtimes]]
  name     = "deno"
  version  = "latest"
  features = ["development"]

[[runtimes]]
  name     = "taplo"
  version  = "latest"
  features = ["development"]
