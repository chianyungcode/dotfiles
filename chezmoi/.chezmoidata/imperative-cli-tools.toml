[[imperative_cli_tools]]
  check = "herdr plugin list --json | jq -e '.result.plugins[] | select(.plugin_id == \"herdr-automatic-rename\")' >/dev/null"
  cli   = "herdr"
  name  = "Herdr Automatic Rename plugin"
  run   = "herdr plugin install qu8n/herdr-automatic-rename --yes"

[[imperative_cli_tools]]
  check = "herdr plugin list --json | jq -e '.result.plugins[] | select(.plugin_id == \"jhochenbaum.hunkdiff\")' >/dev/null"
  cli   = "herdr"
  name  = "Herdr Hunk Diff"
  run   = "herdr plugin install jhochenbaum/herdr-hunk-diff --yes"

[[imperative_cli_tools]]
  check = "npx --yes skills ls --global --json | jq -e '.[] | select(.name == \"ponytail\")' >/dev/null"
  cli   = "npx"
  name  = "Ponytail skill"
  run   = "npx --yes skills add DietrichGebert/ponytail --skill ponytail --agent codex claude-code pi opencode grok --global --yes"

