[packages]
  [packages.pacman]
    to_remove = []

    [packages.pacman.common]
      packages = [
        # System Essentials
        "1password-cli",
        "base-devel",    # Equivalent to apt-transport-https and build essentials
        "curl",
        "logrotate",
        "nano",
        "net-tools",
        "openssh",       # Equivalent to openssh-server
        "polkit-gnome",  # For 1password prompt available
        "sudo",
        "tzdata",
        "unzip",
        "wget",
        "xz",
        "zsh",

        # CLI Utilities
        "bat",    # cat with syntax highlighting and Git integration
        "figlet",
        "lolcat",
        "mc",     # Midnight Commander
        "ncdu",   # NCurses Disk Usage

        # Git & Version Control
        "git",
        "git-extras",

        # Security
        "gnome-keyring", # For 1password two factor auth
        "gnupg",

        # Optional
        # "bind-tools", # Equivalent to dnsutils
        # "p7zip",      # Equivalent to p7zip-full
      ]

    [packages.pacman.development]
      packages = [
        # Essential build dependencies for VPS development
        "openssl",
        "pkgconf",
      ]

    [packages.pacman.homelab]
      packages = ["iperf"]

    [packages.pacman.personal]
      packages = [
        # Browser
        "brave-bin",
        # "google-chrome",
        "zen-browser-bin",

        # Utility
        "asciinema", # record your terminal
        "superfile", # file manager in terminal

        # Media
        "spotatui-bin", # Terminal music player

        # Development Tools
        "opencode-bin",
        "fd",
        "fzf",
        "jq",
        "ripgrep",
        "sd",
        "skim",             # Alternative to fzf fuzzy-finder
        "yq",               # YAML processor
        "appimagelauncher", # for integrating .AppImage
        "difftastic",       # diff tools
        "codespell",        # Fix common misspellings in source code and text files
        "dpkg",
        "entr",             # dependency for tmux-autoreload
        "eza",
        "glow",             # Render markdown in CLI
        "gum",              # Fuzzy finder
        "less",
        "pastel",           # converter color in terminal
        "pet-bin",
        "pueue",            # Task runner and scheduler
        "tectonic",
        "thefuck",          # Fix typos
        "tlrc",             # TLDR client, alternative tealdeer
        "vivid",            # Color generator for LS_COLORS env variable
        "bottom",
        "gitleaks",
        "jujutsu",          # jujutsu version control
        "jjui-bin",         # jujutsu tui
        "git-delta",        # Pager for git
        "github-cli",       # Github CLI
        "glab",             # GitLab CLI
        "lazygit",
        # "series",
        "git-graph",
        "fish",
        "ghostty",
        "sesh-bin",            # tmux session manager
        "starship",
        "tmux",
        "tmuxp",               # tmux session manager
        "helix",               # Alternative neovim
        "neovim",
        "cloudflare-warp-bin",
        "docker",
        "docker-compose",
        "lazydocker",
        "tailscale",
        "httpie",              # HTTP client
        "hurl",                # runs HTTP requests defined in a simple plain text format.
        "usbutils",            # check fingerprint info
        "fprintd",             # fingerprint
        "fuse2",               # apidog dependency
        "localsend",
        "lsof",                # opencode-bin dependency
        "ticktick",
        "yubico-piv-tool",
        "redis",               # Redis CLI
        "nix",
        "zlib",                # for building python
        "biome",               # JS/TS linter, formatter
        "eslint",              # JS/TS linter
        "prettier",            # JS/TS formatter
        "ruff",                # Python linter
        "shellcheck",          # bash, sh linter
        "shfmt",               # bash, sh formatter
        "nixfmt",              # Nix formatter
        "stylua",              # Lua formatter
        "markdownlint-cli2",   # Linter for markdown file
        "taplo-cli",           # TOML formatter
        "yamlfmt",             # YAML formatter
        "yamllint",            # YAML linter

        # Text Editors & IDEs
        "datagrip",
        "datagrip-jre", # runtime for datagrip can work
      ]
