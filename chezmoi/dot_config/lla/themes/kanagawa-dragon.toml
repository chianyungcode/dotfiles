name = "kanagawa-dragon"
author = "chianyung"
description = "Kanagawa Dragon dark theme"

[colors]
file = { r = 220, g = 215, b = 186 }
directory = { r = 126, g = 156, b = 216 }
symlink = { r = 122, g = 168, b = 159 }
executable = { r = 152, g = 187, b = 108 }
size = { r = 122, g = 168, b = 159 }
date = { r = 114, g = 113, b = 105 }
user = { r = 200, g = 192, b = 147 }
group = { r = 114, g = 113, b = 105 }
permission_dir = { r = 230, g = 195, b = 132 }
