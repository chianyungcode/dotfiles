[special_files]

[special_files.folders]
".git" = { r = 195, g = 64, b = 67 }
"node_modules" = { r = 114, g = 113, b = 105 }
"target" = { r = 114, g = 113, b = 105 }
"dist" = { r = 114, g = 113, b = 105 }

[special_files.exact_match]
