name = "vesper"
author = "chianyung"
description = "Vesper dark theme"

[colors]
file = { r = 255, g = 255, b = 255 }
directory = { r = 255, g = 199, b = 153 }
symlink = { r = 153, g = 255, b = 228 }
executable = { r = 153, g = 255, b = 228 }
size = { r = 153, g = 255, b = 228 }
date = { r = 160, g = 160, b = 160 }
user = { r = 255, g = 207, b = 168 }
group = { r = 126, g = 126, b = 126 }
permission_dir = { r = 255, g = 199, b = 153 }
permission_read = { r = 153, g = 255, b = 228 }
permission_write = { r = 255, g = 199, b = 153 }
permission_exec = { r = 153, g = 255, b = 228 }
permission_none = { r = 80, g = 80, b = 80 }

[special_files]

[special_files.folders]
".git" = { r = 255, g = 115, b = 0 }
"node_modules" = { r = 126, g = 126, b = 126 }
"target" = { r = 126, g = 126, b = 126 }
"dist" = { r = 126, g = 126, b = 126 }

[special_files.exact_match]
"README.md" = { r = 255, g = 199, b = 153 }
"Cargo.toml" = { r = 153, g = 255, b = 228 }

[extensions.colors]
md = { r = 255, g = 199, b = 153 }
toml = { r = 153, g = 255, b = 228 }
yaml = { r = 153, g = 255, b = 228 }
yml = { r = 153, g = 255, b = 228 }
json = { r = 255, g = 207, b = 168 }
rs = { r = 255, g = 199, b = 153 }
go = { r = 153, g = 255, b = 228 }
lua = { r = 255, g = 207, b = 168 }
