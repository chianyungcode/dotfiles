[cli]
  installer = "internal"

[ui]
  compact_mode         = false
  fork_secondary_model = "grok-build"
  max_thoughts_width   = 120
  permission_mode      = "always-approve"
  yolo                 = false

[marketplace]
  official_marketplace_auto_installed = true

  [[marketplace.sources]]
    git  = "https://github.com/xai-org/plugin-marketplace.git"
    name = "xAI Official"

[telemetry]
  trace_upload = false

[harness]
  disable_codebase_upload = true

[mcp_servers.capacities]
  enabled = true
  url     = "https://api.capacities.io/mcp"

[mcp_servers.context7]
  enabled = true
  headers = { Authorization = "Bearer ${CONTEXT7_MCP_API_KEY}" }
  url     = "https://mcp.context7.com/mcp"

[mcp_servers.deepwiki]
  enabled = false
  url     = "https://mcp.deepwiki.com/mcp"

[mcp_servers.exa]
  enabled = true
  headers = { Authorization = "Bearer ${EXA_API_KEY}" }
  url     = "https://mcp.exa.ai/mcp"

[mcp_servers.linear]
  enabled = true
  headers = { Authorization = "Bearer ${LINEAR_API_KEY}" }
  url     = "https://mcp.linear.app/mcp"

[mcp_servers.tavily]
  enabled = false
  headers = { Authorization = "Bearer ${TAVILY_API_KEY}" }
  url     = "https://mcp.tavily.com/mcp"

[mcp_servers.ticktick]
  enabled = true
  headers = { Authorization = "Bearer ${TICKTICK_API_KEY}" }
  url     = "https://mcp.ticktick.com"
